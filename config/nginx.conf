# B9 static site. Included into nginx's http {} block as conf.d/default.conf;
# the stock /etc/nginx/nginx.conf (workers, mime.types, logging defaults) is
# left untouched.

# Behind kamal-proxy and any CDN, $remote_addr is always the docker bridge,
# so log the forwarded chain instead.
log_format proxied '$http_x_forwarded_for - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent"';

server {
    # IPv4 only: kamal-proxy reaches the container over the docker network,
    # and an IPv6 listen fails to bind wherever the container netns has no
    # IPv6, which takes nginx down with it.
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # /programs -> /programs/ is a 301 from the try_files below. The container
    # is plain HTTP behind kamal-proxy and has no idea TLS terminated upstream,
    # so an absolute Location would send an https visitor to http://, which
    # kamal-proxy then has to redirect back to https. A relative Location keeps
    # the scheme the visitor arrived on and collapses the chain to one hop.
    absolute_redirect off;

    access_log /var/log/nginx/access.log proxied;

    # --- Compression -------------------------------------------------------
    # Raster images (jpg/png/ico) are already compressed and are left alone.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # --- Security headers --------------------------------------------------
    # Locations below use `expires` rather than `add_header Cache-Control`
    # precisely so these are inherited: any add_header in a location would
    # replace this whole set.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Healthcheck (kamal-proxy) ----------------------------------------
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # --- Not found ---------------------------------------------------------
    # Every =404 below renders the site's own 404 page instead of the stock
    # nginx one. `internal` means the file is only reachable as the body of a
    # 404 response: requesting /404.html directly also gets a 404, so there is
    # no 200-status copy of it for Google to index.
    #
    # No `expires` here: nginx's headers filter only sets Expires and
    # Cache-Control on a fixed list of statuses (200, 201, 204, 206, 3xx
    # redirects, 304), and 404 is not one of them. A cache directive on this
    # location is silently dropped, so the page ships without one, which is
    # also what a 404 should do.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # --- Static assets -----------------------------------------------------
    # Filenames are not content-hashed, so a week with revalidation, not a
    # year of immutable. A CDN in front honours this at the edge.
    location /images/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- Stylesheets, scripts, fonts, vector art ---------------------------
    # Same reasoning as /images/: filenames are not content-hashed, so a week
    # with revalidation, not a year of immutable. `expires` only, so the
    # security headers above are inherited rather than replaced.
    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # --- HTML --------------------------------------------------------------
    # Always revalidate, so a deploy is visible immediately at the edge and in
    # the browser. The page is ~12 KB; there is nothing to save by caching it.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    # Dotfiles are never served.
    location ~ /\. {
        deny all;
    }
}
